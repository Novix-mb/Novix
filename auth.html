<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1916">
  <title>NOVIX Account</title>
  <link rel="stylesheet" href="assets/css/auth.css">
  <script>
    window.NOVIX_FIREBASE_CONFIG = {
      apiKey: "AIzaSyB_1GZ7USnFqJ5-bPMwk07TpH7UXQ2tIVk",
      authDomain: "novix-74ae7.firebaseapp.com",
      projectId: "novix-74ae7",
      appId: "1:1068033555371:web:a48711e58dd7613d8db0ee"
    };
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">N</div>
        <div><p class="eyebrow">NOVIX</p><h1 id="auth-title">Your study space, anywhere</h1></div>
      </div>
      <p class="auth-intro">Sign in to resume your workspace, or create an account to sync your tasks, notes and settings.</p>
      <div class="tab-bar" role="tablist" aria-label="Account actions">
        <button class="tab-btn active" data-tab="login" type="button" role="tab">Log in</button>
        <button class="tab-btn" data-tab="signup" type="button" role="tab">Create account</button>
        <button class="tab-btn" data-tab="reset" type="button" role="tab">Reset password</button>
      </div>
      <div class="status-box" id="statusBox" role="status" aria-live="polite">Connecting to NOVIX accounts…</div>
      <form id="loginForm" class="auth-form active">
        <label><span>Email</span><input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <label><span>Password</span><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required></label>
        <button type="submit" class="primary-btn">Log in</button>
      </form>
      <form id="signupForm" class="auth-form">
        <label><span>Full name</span><input id="signupName" type="text" autocomplete="name" maxlength="80" placeholder="Your name" required></label>
        <label><span>Email</span><input id="signupEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <label><span>Password</span><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label>
        <label><span>Confirm password</span><input id="signupConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="Type it again" required></label>
        <button type="submit" class="primary-btn">Create account</button>
      </form>
      <form id="resetForm" class="auth-form">
        <label><span>Email</span><input id="resetEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <button type="submit" class="secondary-btn">Email me a reset link</button>
      </form>
      <section class="user-panel" id="userPanel" hidden aria-live="polite">
        <div class="user-avatar" id="userAvatar">N</div>
        <div class="user-info"><span class="user-label">Signed in as</span><strong id="userName">Guest</strong></div>
        <button id="logoutBtn" type="button" class="secondary-btn">Log out</button>
      </section>
      <div class="footer-actions"><a class="ghost-btn" href="./">Back to NOVIX</a><button id="guestBtn" type="button" class="ghost-btn">Continue as guest</button></div>
      <p class="auth-footnote">Your password is handled by Firebase Authentication and is never stored in NOVIX.</p>
    </section>
  </main>
  <script defer src="assets/js/auth.js"></script>
</body>
</html>
