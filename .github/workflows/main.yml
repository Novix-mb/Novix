name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stamp service worker version
        run: |
          if [ -f sw.js ] && grep -q "^const VERSION" sw.js; then
            sed -i "s/^const VERSION = '.*';/const VERSION = '${GITHUB_SHA::10}';/" sw.js
            echo "✅ Service worker version stamped successfully:"
            grep "^const VERSION" sw.js
          else
            echo "⚠️ Warning: 'const VERSION' not found in sw.js - skipping stamp step."
            echo "Make sure sw.js exists and contains a line like: const VERSION = 'dev';"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
